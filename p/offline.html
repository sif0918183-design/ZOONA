        :root {

        }

        body {
            font-family: 'Tajawal', sans-serif;

            margin-bottom: 25px;
        }

        .icon {
            font-size: 50px;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #b71c1c; /* ظل أغمق للون الأساسي */
