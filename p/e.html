<html lang="ar">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب جديد - ZOONA SD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f7f7f7 0%, #e9ecef 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .order-container {
            background-color: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
            margin: auto;
            border: 1px solid #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .order-container::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #e63946 0%, #457b9d 100%);
        }

        .order-container h2 {
            text-align: center;
            color: #2a4365;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            position: relative;
            padding-bottom: 12px;
        }

        .order-container h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 35%;
            width: 30%;
            height: 3px;
            background: linear-gradient(90deg, #e63946 0%, #457b9d 100%);
            border-radius: 3px;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #4a5568;
            font-size: 0.85rem;
        }

        .form-group i {
            position: absolute;
            left: 12px;
            top: 38px;
            color: #a0aec0;
            font-size: 16px;
        }

        .order-container input, .order-container select, .order-container textarea {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border-radius: 8px;
            border: 1.5px solid #e2e8f0;
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
            background-color: #fafafa;
            color: #2d3748;
        }

        .order-container input:focus, .order-container select:focus, .order-container textarea:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
            background-color: #fff;
        }

        .order-container button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #submitBtn {
            background: linear-gradient(135deg, #e63946 0%, #d62839 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
        }

        #submitBtn:hover:not(:disabled) {
            background: linear-gradient(135deg, #d62839 0%, #c1121f 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.4);
        }

        #submitBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        #submitBtn:disabled:hover {
            transform: none !important;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3) !important;
        }

        #downloadPDF {
            background: linear-gradient(135deg, #457b9d 0%, #1d3557 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(69, 123, 157, 0.3);
            opacity: 0;
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        #downloadPDF.show {
            opacity: 1;
            height: auto;
            padding: 12px;
            margin-top: 8px;
        }

        #downloadPDF:hover {
            background: linear-gradient(135deg, #1d3557 0%, #14213d 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(69, 123, 157, 0.4);
        }

        #backToHomeBtn {
            text-decoration: none;
            display: none;
            margin-top: 8px;
        }

        #backToHomeBtn button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(56, 161, 105, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #backToHomeBtn button:hover {
            background: linear-gradient(135deg, #2f855a 0%, #276749 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 161, 105, 0.4);
        }

        .success-message, .error-message {
            text-align: center;
            font-weight: bold;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .success-message { 
            color: #276749;
            background-color: #f0fff4;
            border: 1px solid #9ae6b4;
        }

        .error-message { 
            color: #c53030;
            background-color: #fff5f5;
            border: 1px solid #fc8181;
        }

        .total-container {
            background-color: #f7fafc;
            border-radius: 8px;
            padding: 12px 15px;
            margin: 15px 0;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .total-label {
            color: #2d3748;
        }

        .total-amount {
            color: #e63946;
        }

        .payment-type {
            color: #e63946;
            font-size: 0.8rem;
            margin-top: 3px;
            font-weight: 600;
        }

        .products-summary {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid #e2e8f0;
        }

        .products-summary h4 {
            margin-bottom: 10px;
            color: #2d4365;
            border-bottom: 2px solid #e63946;
            padding-bottom: 6px;
            font-size: 0.95rem;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        .product-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .product-name {
            font-weight: 600;
            color: #2d3748;
            font-size: 0.85rem;
        }

        .product-details {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 2px;
        }

        .product-price {
            font-weight: bold;
            color: #e63946;
            text-align: left;
            font-size: 0.85rem;
        }

        .warehouse-section {
            background: #e8f5e8;
            padding: 12px;
            border-radius: 6px;
            margin: 8px 0;
            border-right: 3px solid #38a169;
        }

        .warehouse-title {
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .warehouse-city-select {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e0;
        }

        .warehouse-city-select label {
            font-weight: 600;
            color: #2d3748;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 4px;
        }

        .warehouse-city-select select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1.5px solid #e2e8f0;
            font-size: 13px;
            font-family: 'Tajawal', sans-serif;
            background-color: #fafafa;
            color: #2d3748;
            transition: all 0.3s ease;
        }

        .warehouse-city-select select:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
            background-color: #fff;
        }

        .warehouse-subtotal {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #2d3748;
            font-size: 0.85rem;
        }

        .warehouse-subtotal .amount {
            color: #e63946;
        }

        .warehouse-not-selected {
            color: #e53e3e;
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        .warehouse-not-selected.show {
            display: block;
        }

        .shipping-cost {
            background: #e63946;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .input-with-icon {
            position: relative;
        }

        .required::after {
            content: " *";
            color: #e53e3e;
        }

        .form-note {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 3px;
            text-align: right;
        }

        .order-id {
            font-size: 0.85rem;
            color: #457b9d;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            direction: ltr;
        }

        .auto-filled {
            background-color: #f0fff4 !important;
            border-color: #9ae6b4 !important;
        }

        .affiliate-notice {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
            color: #096dd9;
            font-weight: 500;
            font-size: 0.85rem;
            display: none;
        }

        .summary-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 0.8rem;
        }

        .summary-total {
            font-weight: bold;
            font-size: 0.9rem;
            color: #e63946;
            border-top: 1px solid #e2e8f0;
            padding-top: 6px;
            margin-top: 6px;
        }

        .shipping-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .shipping-container h3 {
            color: #2a4365;
            margin-bottom: 15px;
            font-size: 1rem;
            border-bottom: 2px solid #e63946;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-warning {
            color: #e53e3e;
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .map-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .map-container {
            background-color: white;
            border-radius: 16px;
            overflow: hidden;
            width: 90%;
            max-width: 600px;
            height: 70%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        #locationMap {
            height: 100%;
            width: 100%;
            flex-grow: 1;
        }

        .map-controls {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background-color: #f8f9fa;
            border-top: 1px solid #e2e8f0;
        }

        .map-control-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
        }

        #confirmLocation {
            background-color: #38a169;
            color: white;
        }

        #confirmLocation:hover {
            background-color: #2f855a;
        }

        #cancelLocation {
            background-color: #e53e3e;
            color: white;
        }

        #cancelLocation:hover {
            background-color: #c53030;
        }

        #locateMe {
            background-color: #4299e1;
            color: white;
        }

        #locateMe:hover {
            background-color: #3182ce;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .order-container {
                padding: 15px;
            }
            .order-container h2 {
                font-size: 1.3rem;
            }
            .order-container input, .order-container button, .order-container select {
                padding: 8px 10px 8px 35px;
                font-size: 13px;
            }
            .form-group i {
                left: 10px;
                top: 35px;
                font-size: 14px;
            }
            .product-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 3px;
            }
            .product-price {
                text-align: right;
                width: 100%;
            }
            .map-container {
                width: 95%;
                height: 80%;
            }
            .map-controls {
                flex-direction: column;
                gap: 8px;
            }
            .map-control-btn {
                width: 100%;
            }
            .warehouse-section {
                padding: 10px;
            }
            .warehouse-city-select select {
                font-size: 13px;
                padding: 6px 8px;
            }
        }

        .pdf-template {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 210mm;
            padding: 20mm;
            background: white;
            font-family: 'Tajawal', sans-serif;
            direction: rtl;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .pdf-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e63946;
            position: relative;
        }

        .pdf-logo {
            height: 60px;
            margin-bottom: 10px;
        }

        .pdf-header h1 {
            color: #2a4365;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .pdf-header .date {
            color: #718096;
            font-size: 14px;
            direction: ltr;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .pdf-details {
            margin-top: 20px;
        }

        .pdf-details div {
            margin: 12px 0;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
        }

        .pdf-label {
            font-weight: bold;
            color: #2d3748;
            width: 120px;
            flex-shrink: 0;
        }

        .pdf-value {
            color: #4a5568;
            flex-grow: 1;
        }

        .pdf-products {
            margin: 20px 0;
        }

        .pdf-product-item {
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
        }

        .pdf-footer {
            margin-top: 30px;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            color: #718096;
            font-style: italic;
        }

        .user-id-container {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            display: none;
        }

        .user-id-label {
            color: #0369a1;
            font-weight: 600;
        }

        .user-id-value {
            color: #0c4a6e;
            font-weight: 700;
            direction: ltr;
            font-family: monospace;
            background: #e0f2fe;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .auto-city-detection {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 6px;
            padding: 8px;
            margin: 8px 0;
            font-size: 0.8rem;
            color: #276749;
            display: none;
        }

        .warehouse-city-select .city-option-cod {
            color: #2d3748;
        }

        .warehouse-city-select .city-option-prepaid {
            color: #2b6cb0;
        }
    </style>
</head>
<body>
    <div class="order-container">
        <h2>طلب جديد</h2>
        
        <div class="user-id-container">
            <span class="user-id-label">معرف المستخدم:</span>
            <span class="user-id-value" id="userIdDisplay">جاري التحميل...</span>
        </div>
        
        <div id="autoCityDetection" class="auto-city-detection">
            <i class="fas fa-check-circle"></i>
            <span id="autoCityMessage"></span>
        </div>
        
        <div id="affiliateNotice" class="affiliate-notice"></div>
        
        <form id="orderForm">
            <div class="form-group">
                <label for="name" class="required">الاسم الكامل</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input id="name" placeholder="أدخل اسمك الكامل" required type="text" />
                </div>
            </div>
            
            <div class="form-group">
                <label for="phone" class="required">رقم الهاتف</label>
                <div class="input-with-icon">
                    <i class="fas fa-phone"></i>
                    <input id="phone" placeholder="09xxxxxxxx" required type="tel" pattern="[0-9]{10}" />
                </div>
                <div class="form-note">يجب أن يتكون الرقم من 10 أرقام</div>
            </div>
            
            <div class="form-group">
                <label for="phone2">رقم هاتف إضافي (اختياري)</label>
                <div class="input-with-icon">
                    <i class="fas fa-phone-alt"></i>
                    <input id="phone2" placeholder="01xxxxxxxx" type="tel" pattern="[0-9]{10}" />
                </div>
            </div>
            
            <div class="products-summary" id="productsSummary">
                <h4><i class="fas fa-shopping-cart"></i> المنتجات المطلوبة</h4>
                <div id="productsList"></div>
                <div class="summary-details" id="summaryDetails"></div>
            </div>
            
            <div class="shipping-container">
                <h3><i class="fas fa-truck"></i> عنوان التوصيل</h3>
                
                <div class="form-group">
                    <label for="address" class="required">وصف العنوان (أضف وصف مختصر)</label>
                    <div class="input-with-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <textarea id="address" placeholder="اكتب وصفًا موجزًا (الحي، الشارع، رقم المنزل، معلم بارز...)" required rows="3"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="total-container">
                <div>
                    <div class="total-label">المجموع الكلي</div>
                    <div class="payment-type" id="paymentType"></div>
                </div>
                <div class="total-amount" id="totalAmount">0 SDG</div>
            </div>
            
            <button type="submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> إرسال الطلب
            </button>
        </form>
        
        <div class="order-id" id="orderId"></div>
        
        <button id="downloadPDF">
            <i class="fas fa-download"></i> تحميل نسخة PDF من إيصال الطلب
        </button>

        <a href="https://zoonasd.com" id="backToHomeBtn">
            <button>
                <i class="fas fa-arrow-right"></i> عودة إلى الرئيسية
            </button>
        </a>
        
        <div class="success-message" id="successMsg"></div>
        <div class="error-message" id="errorMsg"></div>
    </div>
    
    <div id="pdfTemplate" class="pdf-template">
        <div class="pdf-header">
            <h1>طلب جديد - Zoona mall</h1>
            <div class="date" id="pdfDate"></div>
            <div class="date" id="pdfOrderId"></div>
        </div>
        
        <div class="pdf-details">
            <div><span class="pdf-label">معرف المستخدم:</span> <span id="pdfUserId"></span></div>
            <div><span class="pdf-label">الاسم الكامل:</span> <span id="pdfName"></span></div>
            <div><span class="pdf-label">رقم الهاتف:</span> <span id="pdfPhone"></span></div>
            <div><span class="pdf-label">رقم إضافي:</span> <span id="pdfPhone2"></span></div>
            <div><span class="pdf-label">عنوان التوصيل:</span> <span id="pdfAddress"></span></div>
            <div><span class="pdf-label">نوع الدفع:</span> <span id="pdfPaymentType"></span></div>
        </div>
        
        <div class="pdf-products" id="pdfProductsList"></div>
        
        <div class="pdf-details">
            <div><span class="pdf-label">المجموع الكلي:</span> <span id="pdfTotal"></span></div>
        </div>
        
        <div class="pdf-footer">

        // ========== تكوين API (Proxy) ==========
        let requestCache = new Map();
        const CACHE_DURATION = 10000;

        async function fetchWithRetry(url, fetchOptions, maxRetries = 3, delay = 1000) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(url, fetchOptions);
                    if ((response.status === 409 || response.status >= 500) && attempt < maxRetries) {
                        console.warn(`⚠️ خطأ ${response.status} في المحاولة ${attempt}. إعادة المحاولة...`);
                        await new Promise(resolve => setTimeout(resolve, delay * attempt));
                        continue;
                    }
                    return response;
                } catch (error) {
                    if (attempt === maxRetries) throw error;
                    console.warn(`⚠️ خطأ في الاتصال بالمحاولة ${attempt}. إعادة المحاولة...`);
                    await new Promise(resolve => setTimeout(resolve, delay * attempt));
                }
            }
        }

        async function callSupabase(endpoint, options = {}) {
            const isGet = !options.method || options.method.toUpperCase() === 'GET';
            const cacheKey = `${endpoint}`;

            if (isGet) {
                const cached = requestCache.get(cacheKey);
                if (cached && (Date.now() - cached.timestamp < CACHE_DURATION)) {
                    console.log(`✅ استخدام الكاش لـ ${endpoint}`);
                    return cached.data;
                }
            } else {
                requestCache.clear();
                console.log('🗑️ تم مسح الكاش بسبب عملية كتابة');
            }

            const url = `/api/orders?endpoint=${encodeURIComponent(endpoint)}`;
            const fetchOptions = {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            };

            try {
                const response = await fetchWithRetry(url, fetchOptions);
                if (response.status === 204) return null;
                if (!response.ok) {
                    const err = await response.json().catch(() => ({ error: 'Request failed' }));
                    throw new Error(err.error || `Request failed with status ${response.status}`);
                }
                const data = await response.json();
                if (isGet) {
                    requestCache.set(cacheKey, { data, timestamp: Date.now() });
                }
                return data;
            } catch (error) {
                console.error(`❌ خطأ في استدعاء ${endpoint}:`, error);
                throw error;
            }
        }

        // ========== دوال إدارة بيانات المسوق ==========
        async function saveAffiliateData(orderData) {
            try {
                console.log('💰 معالجة بيانات المسوق:', orderData.affiliateId);
                const affiliates = await callSupabase(`affiliate_users?select=affiliate_id&affiliate_id=eq.${orderData.affiliateId}`);
                if (!affiliates || affiliates.length === 0) {
                    console.warn('⚠️ المسوق غير موجود');
                    return;
                }

                let commissionSettings = { threshold: 100000, lowRate: 8, highRate: 6 };
                try {
                    const settings = await callSupabase('admin_settings?select=*');
                    if (settings && settings.length > 0) {
                        const threshold = settings.find(s => s.key === 'commission_threshold');
                        const lowRate = settings.find(s => s.key === 'commission_low_rate');
                        const highRate = settings.find(s => s.key === 'commission_high_rate');
                        if (threshold) commissionSettings.threshold = parseInt(threshold.value);
                        if (lowRate) commissionSettings.lowRate = parseInt(lowRate.value);
                        if (highRate) commissionSettings.highRate = parseInt(highRate.value);
                    }
                } catch (e) { console.error('❌ خطأ في جلب الإعدادات:', e); }

                let products = [];
                try {
                    products = await callSupabase('products?select=id,name,commission,price');
                } catch (e) { console.error('❌ خطأ في جلب المنتجات:', e); }

                let totalCommission = 0;
                let commissionDetail = "";
                if (products && products.length > 0) {
                    orderData.products.forEach(item => {
                        const product = products.find(p => p.id == item.id || (p.name && item.name && p.name.trim() === item.name.trim()));
                        const price = product ? product.price : item.price;
                        const rate = price < commissionSettings.threshold ? commissionSettings.lowRate : commissionSettings.highRate;
                        totalCommission += Math.round(price * (rate / 100)) * item.quantity;
                    });
                    commissionDetail = `Calculated strictly by rates (Threshold: ${commissionSettings.threshold}, Rates: ${commissionSettings.lowRate}%/${commissionSettings.highRate}%)`;
                } else {
                    const netTotal = (orderData.total - (orderData.shippingCost || 0));
                    const rate = netTotal < commissionSettings.threshold ? commissionSettings.lowRate : commissionSettings.highRate;
                    totalCommission = Math.round(netTotal * (rate / 100));
                    commissionDetail = "Tiered fallback strictly by rates";
                }

                await callSupabase('affiliate_orders', {
                    method: 'POST',
                    body: JSON.stringify([{
                        affiliate_id: orderData.affiliateId,
                        order_id: orderData.orderId,
                        commission: totalCommission,
                        commission_rate: commissionDetail,
                        status: 'pending',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    }])
                });
                console.log('✅ تم حفظ بيانات المسوق بنجاح');
            } catch (error) {
                console.error('❌ خطأ في حفظ بيانات المسوق:', error);
            }
        }

        async function updateAffiliateStats(affiliateId) {
            try {
                let clicks = [];
                try { clicks = await callSupabase(`affiliate_clicks?select=id&affiliate_id=eq.${affiliateId}`); } catch (e) {}
                let orders = [];
                try { orders = await callSupabase(`orders?select=id&affiliate_id=eq.${affiliateId}`); } catch (e) {}
                const confirmedCommission = await calculateConfirmedCommission(affiliateId);
                await callSupabase(`affiliate_users?affiliate_id=eq.${affiliateId}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        total_clicks: clicks ? clicks.length : 0,
                        total_orders: orders ? orders.length : 0,
                        total_commission: confirmedCommission,
                        last_updated: new Date().toISOString()
                    })
                });
                console.log('✅ تم تحديث إحصائيات المسوق بنجاح');
            } catch (error) {
                console.error('❌ خطأ في تحديث الإحصائيات:', error);
            }
        }

        async function calculateConfirmedCommission(affiliateId) {
            try {
                let commissionSettings = { threshold: 100000, lowRate: 8, highRate: 6 };
                try {
                    const settings = await callSupabase('admin_settings?select=*');
                    if (settings && settings.length > 0) {
                        const threshold = settings.find(s => s.key === 'commission_threshold');
                        const lowRate = settings.find(s => s.key === 'commission_low_rate');
                        const highRate = settings.find(s => s.key === 'commission_high_rate');
                        if (threshold) commissionSettings.threshold = parseInt(threshold.value);
                        if (lowRate) commissionSettings.lowRate = parseInt(lowRate.value);
                        if (highRate) commissionSettings.highRate = parseInt(highRate.value);
                    }
                } catch (e) {}
                let confirmedOrders = [];
                try {
                    confirmedOrders = await callSupabase(`orders?select=*,order_products(*)&affiliate_id=eq.${affiliateId}&status=in.("confirmed","delivered")`);
                } catch (e) {}
                let products = [];
                try { products = await callSupabase('products?select=*'); } catch (e) {}
                let totalConfirmedCommission = 0;
                if (confirmedOrders && confirmedOrders.length > 0) {
                    confirmedOrders.forEach(order => {
                        const commission = getProductCommission(order.order_products, products, commissionSettings);
                        totalConfirmedCommission += commission;
                    });
                }
                return totalConfirmedCommission;
            } catch (error) {
                console.error('❌ خطأ في حساب العمولة المؤكدة:', error);
                return 0;
            }
        }

        function getProductCommission(orderProducts, products, commissionSettings) {
            if (!orderProducts || !Array.isArray(orderProducts) || orderProducts.length === 0 || !products || products.length === 0) return 0;
            let totalCommission = 0;
            orderProducts.forEach(orderProduct => {
                if (!orderProduct.product_name) return;
                const cleanText = (text) => text.toLowerCase().replace(/[❤️✨]/g, '').replace(/\s+/g, ' ').trim();
                const cleanOrderProduct = cleanText(orderProduct.product_name);
                const product = products.find(p => {
                    if (!p.name) return false;
                    const cleanProductName = cleanText(p.name);
                    const orderWords = cleanOrderProduct.split(' ');
                    const productWords = cleanProductName.split(' ');
                    const commonWords = orderWords.filter(word => productWords.some(pWord => pWord.includes(word) || word.includes(pWord)));
                    return commonWords.length >= 2;
                });
                if (product && product.price) {
                    const rate = product.price < commissionSettings.threshold ? commissionSettings.lowRate : commissionSettings.highRate;
                    totalCommission += Math.round(product.price * (rate / 100)) * (orderProduct.quantity || 1);
                }
            });
            return totalCommission;
        }
        
        // ========== دالة تنظيف بيانات المسوق ==========
        function clearAffiliateIdFromStorage() {
            const affiliateKeys = ['currentAffiliateId', 'affiliateId', 'ref'];
            affiliateKeys.forEach(key => {
                if (localStorage.getItem(key)) localStorage.removeItem(key);
            });
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('affiliate') || key.includes('ref'))) keysToRemove.push(key);
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            cartItems.forEach(item => { if (item.affiliateId) delete item.affiliateId; });

                const url = new URL(window.location);
                url.searchParams.delete('ref');
                window.history.replaceState({}, '', url);
            }
            console.log('✅ تم تنظيف جميع بيانات المسوق بنجاح');
        }

        // ========== دوال عرض المنتجات مع اختيار مدينة لكل مستودع ==========
        function getUniqueWarehouses() {
            const warehouses = {};
            cartItems.forEach(item => {
                if (!warehouses[item.warehouse]) {
                    warehouses[item.warehouse] = [];
                }
                warehouses[item.warehouse].push(item);
            });
            return warehouses;
        }

        function getAvailableCitiesForWarehouse(warehouseName) {
            const warehouseItems = cartItems.filter(item => item.warehouse === warehouseName);
            const codCities = [];
            const prepaidCities = [];
            
            warehouseItems.forEach(item => {
                let cod = Array.isArray(item.cashOnDelivery) ? item.cashOnDelivery : [];
                let pre = Array.isArray(item.prepaid) ? item.prepaid : [];
                if (cod.length === 0 && pre.length === 0 && item.delivery_cities) {
                    let dc = item.delivery_cities;
                    if (typeof dc === 'string') {
                        try { dc = JSON.parse(dc); } catch(e) { dc = []; }
                    }
                    if (Array.isArray(dc)) {
                        cod = dc.filter(c => c.type === 'cod');
                        pre = dc.filter(c => c.type === 'prepaid');
                    }
                }
                cod.forEach(city => {
                    if (!codCities.find(c => c.name === city.name)) {
                        codCities.push(city);
                    }
                });
                pre.forEach(city => {
                    if (!prepaidCities.find(c => c.name === city.name)) {
                        prepaidCities.push(city);
                    }
                });
            });
            
            return { cod: codCities, prepaid: prepaidCities };
        }

        function renderWarehouseSections() {
            const productsList = document.getElementById('productsList');
            const warehouses = getUniqueWarehouses();
            const warehouseNames = Object.keys(warehouses);
            
            if (warehouseNames.length === 0) {
                productsList.innerHTML = '<p style="text-align: center; color: #666; padding: 15px; font-size: 0.9rem;">لا توجد منتجات في السلة</p>';
                return;
            }

            let html = '';

            warehouseNames.forEach(warehouseName => {
                const items = warehouses[warehouseName];
                const cities = getAvailableCitiesForWarehouse(warehouseName);
                const allCities = [...cities.cod, ...cities.prepaid];
                
                if (!warehouseSelections[warehouseName]) {
                    warehouseSelections[warehouseName] = { city: null, type: null, price: 0 };
                }

                const warehouseTotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                
                html += `<div class="warehouse-section" data-warehouse="${warehouseName}">`;
                html += `<div class="warehouse-title">
                    <i class="fas fa-warehouse"></i> 
                    مستودع ${warehouseName}
                </div>`;

                items.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    html += `
                        <div class="product-item">
                            <div>
                                <div class="product-name">${item.name}</div>
                                <div class="product-details">الكمية: ${item.quantity} | السعر: ${item.price.toLocaleString()} SDG</div>
                            </div>
                            <div class="product-price">${itemTotal.toLocaleString()} SDG</div>
                        </div>
                    `;
                });

                html += `<div class="warehouse-city-select">`;
                html += `<label>مدينة التوصيل</label>`;
                html += `<select data-warehouse="${warehouseName}" class="warehouse-city-selector">`;
                html += `<option value="">-- اختر مدينة التوصيل --</option>`;

                if (allCities.length === 0) {
                    html += `<option value="" disabled>لا توجد مدن متاحة لهذا المستودع</option>`;
                } else {
                    cities.cod.forEach(city => {
                        const selected = warehouseSelections[warehouseName].city === city.name && warehouseSelections[warehouseName].type === 'cod' ? 'selected' : '';
                        html += `<option value="cod_${city.name}" ${selected} class="city-option-cod">
                            ${city.name} - ${city.price.toLocaleString()} SDG (دفع عند الاستلام)
                        </option>`;
                    });
                    cities.prepaid.forEach(city => {
                        const selected = warehouseSelections[warehouseName].city === city.name && warehouseSelections[warehouseName].type === 'prepaid' ? 'selected' : '';
                        html += `<option value="prepaid_${city.name}" ${selected} class="city-option-prepaid">
                            ${city.name} - ${city.price.toLocaleString()} SDG (دفع مقدم)
                        </option>`;
                    });
                }

                html += `</select>`;

                const shippingCost = warehouseSelections[warehouseName].price || 0;
                const totalWithShipping = warehouseSelections[warehouseName].city ? warehouseTotal + shippingCost : 0;
                
                html += `<div class="warehouse-subtotal">`;
                html += `<span>مجموع المستودع:</span>`;
                if (warehouseSelections[warehouseName].city) {
                    html += `<span class="amount">${totalWithShipping.toLocaleString()} SDG (شامل ${shippingCost.toLocaleString()} SDG توصيل)</span>`;
                } else {
                    html += `<span class="amount" style="color: #a0aec0;">${warehouseTotal.toLocaleString()} SDG</span>`;
                }
                html += `</div>`;

                if (!warehouseSelections[warehouseName].city && allCities.length > 0) {
                    html += `<div class="warehouse-not-selected show"><i class="fas fa-exclamation-circle"></i> يرجى اختيار مدينة توصيل لإضافة هذا المستودع إلى المجموع الكلي</div>`;
                } else {
                    html += `<div class="warehouse-not-selected"></div>`;
                }

                html += `</div>`;
                html += `</div>`;
            });

            productsList.innerHTML = html;

            document.querySelectorAll('.warehouse-city-selector').forEach(select => {
                select.addEventListener('change', function() {
                    const warehouseName = this.dataset.warehouse;
                    const value = this.value;
                    
                    if (value) {
                        const [type, cityName] = value.split('_');
                        const cities = type === 'cod' ? 
                            getAvailableCitiesForWarehouse(warehouseName).cod : 
                            getAvailableCitiesForWarehouse(warehouseName).prepaid;
                        const city = cities.find(c => c.name === cityName);
                        
                        if (city) {
                            warehouseSelections[warehouseName] = {
                                city: city.name,
                                type: type,
                                price: city.price
                            };
                        }
                    } else {
                        warehouseSelections[warehouseName] = { city: null, type: null, price: 0 };
                    }
                    
                    updateSummaryAndTotal();
                });
            });
        }

        function updateSummaryAndTotal() {
            const summaryDetails = document.getElementById('summaryDetails');
            const totalAmount = document.getElementById('totalAmount');
            const paymentType = document.getElementById('paymentType');
            
            let totalProducts = 0;
            let grandTotal = 0;
            let totalShipping = 0;
            let allCod = true;
            let anyCitySelected = false;
            let warehouseDetails = [];
            
            const warehouses = getUniqueWarehouses();
            const warehouseNames = Object.keys(warehouses);
            
            warehouseNames.forEach((warehouseName) => {
                const items = warehouses[warehouseName];
                const warehouseTotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                totalProducts += items.reduce((sum, item) => sum + item.quantity, 0);
                
                const selection = warehouseSelections[warehouseName];
                let shippingCost = 0;
                let warehouseTotalWithShipping = warehouseTotal;
                
                if (selection && selection.city) {
                    shippingCost = selection.price || 0;
                    warehouseTotalWithShipping = warehouseTotal + shippingCost;
                    totalShipping += shippingCost;
                    anyCitySelected = true;
                    if (selection.type !== 'cod') {
                        allCod = false;
                    }
                    warehouseDetails.push({
                        name: warehouseName,
                        city: selection.city,
                        type: selection.type,
                        total: warehouseTotalWithShipping,
                        shipping: shippingCost,
                        products: warehouseTotal,
                        selected: true
                    });
                } else {
                    warehouseDetails.push({
                        name: warehouseName,
                        city: null,
                        type: null,
                        total: 0,
                        shipping: 0,
                        products: warehouseTotal,
                        selected: false
                    });
                }
            });
            
            warehouseDetails.forEach(detail => {
                if (detail.selected) {
                    grandTotal += detail.total;
                }
            });
            
            let summaryHTML = '';
            summaryHTML += `<div class="summary-row"><span>عدد المنتجات الكلي:</span><span>${totalProducts}</span></div>`;
            
            warehouseDetails.forEach(detail => {
                if (detail.selected) {
                    summaryHTML += `<div class="summary-row" style="font-size:0.78rem; color:#2d3748; padding-right:8px; border-right:2px solid #38a169;">
                        <span>مستودع ${detail.name} (${detail.city})</span>
                        <span>${detail.total.toLocaleString()} SDG</span>
                    </div>`;
                } else {
                    summaryHTML += `<div class="summary-row" style="font-size:0.78rem; color:#a0aec0; padding-right:8px; border-right:2px solid #e2e8f0;">
                        <span>مستودع ${detail.name} (لم يتم الاختيار)</span>
                        <span>${detail.products.toLocaleString()} SDG</span>
                    </div>`;
                }
            });
            
            if (anyCitySelected) {
                summaryHTML += `<div class="summary-row"><span>إجمالي تكاليف الشحن:</span><span>${totalShipping.toLocaleString()} SDG</span></div>`;
                summaryHTML += `<div class="summary-total summary-row"><span>المجموع الكلي:</span><span>${grandTotal.toLocaleString()} SDG</span></div>`;
                totalAmount.textContent = `${grandTotal.toLocaleString()} SDG`;
                paymentType.textContent = allCod ? 'دفع عند الاستلام' : 'دفع مقدم (بعض المستودعات)';
            } else {
                summaryHTML += `<div class="summary-total summary-row" style="color:#a0aec0;">
                    <span>المجموع الكلي:</span>
                    <span>يرجى اختيار مدينة توصيل لكل مستودع</span>
                </div>`;
                totalAmount.textContent = '0 SDG';
                paymentType.textContent = '';
            }
            
            summaryDetails.innerHTML = summaryHTML;
            
            document.querySelectorAll('.warehouse-section').forEach(section => {
                const warehouseName = section.dataset.warehouse;
                const warningEl = section.querySelector('.warehouse-not-selected');
                const selection = warehouseSelections[warehouseName];
                const cities = getAvailableCitiesForWarehouse(warehouseName);
                const allCities = [...cities.cod, ...cities.prepaid];
                
                if (warningEl) {
                    if (!selection || !selection.city) {
                        if (allCities.length > 0) {
                            warningEl.classList.add('show');
                            warningEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> يرجى اختيار مدينة توصيل لإضافة هذا المستودع إلى المجموع الكلي';
                        } else {
                            warningEl.classList.remove('show');
                        }
                    } else {
                        warningEl.classList.remove('show');
                    }
                }
            });
        }

        // ========== دوال المساعدة ==========
        function generateOrderId() {
            const timestamp = Date.now().toString(36);
            const random = Math.random().toString(36).substr(2, 5);
            return `ORDER-${timestamp}-${random}`.toUpperCase();
        }
        
        function getFormattedDate() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long',
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'Africa/Khartoum'
            };
            return now.toLocaleDateString('en-US', options);
        }
        
        function validateForm() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            
            if (!name.trim()) {
                return 'يرجى إدخال الاسم الكامل';
            }
            if (!phone.match(/^[0-9]{10}$/)) {
                return 'يرجى إدخال رقم هاتف صحيح (10 أرقام)';
            }
            if (cartItems.length === 0) {
                return 'السلة فارغة. أضف منتجات أولاً';
            }
            if (!address.trim()) {
                return 'يرجى إدخال وصف عنوان التوصيل';
            }
            
            const warehouses = getUniqueWarehouses();
            const warehouseNames = Object.keys(warehouses);
            let allSelected = true;
            warehouseNames.forEach(name => {
                if (!warehouseSelections[name] || !warehouseSelections[name].city) {
                    allSelected = false;
                }
            });
            
            if (!allSelected) {
                return 'يرجى اختيار مدينة توصيل لكل مستودع';
            }
            
            return null;
        }
        
        // ========== دوال PDF ==========
        function setupPDFDownload() {
            const downloadBtn = document.getElementById('downloadPDF');
            downloadBtn.addEventListener('click', async () => {
                let orderData;
                if (downloadBtn.hasAttribute('data-order')) {
                    orderData = JSON.parse(downloadBtn.getAttribute('data-order'));
                } else {
                    document.getElementById('errorMsg').textContent = "لا توجد بيانات طلب متاحة لإنشاء PDF.";
                    return;
                }
                
                const setPdfContent = (id, value) => {
                    const element = document.getElementById(id);
                    if (element) element.textContent = value;
                };
                
                setPdfContent('pdfUserId', orderData.userId || '');
                setPdfContent('pdfName', orderData.name || '');
                setPdfContent('pdfPhone', orderData.phone || '');
                setPdfContent('pdfPhone2', orderData.phone2 || 'غير متوفر');
                setPdfContent('pdfAddress', orderData.address || '');
                setPdfContent('pdfPaymentType', orderData.cityType === 'cod' ? 'دفع عند الاستلام' : 'دفع مقدم');
                setPdfContent('pdfTotal', `${orderData.total.toLocaleString()} SDG`);
                setPdfContent('pdfDate', getFormattedDate());
                setPdfContent('pdfOrderId', `رقم الطلب: ${orderData.orderId || ''}`);
                
                const pdfProductsList = document.getElementById('pdfProductsList');
                pdfProductsList.innerHTML = '<div style="margin: 15px 0; font-weight: bold;">المنتجات المطلوبة:</div>';
                
                orderData.products.forEach(item => {
                    const productElement = document.createElement('div');
                    productElement.className = 'pdf-product-item';
                    productElement.innerHTML = `
                        <span>${item.name} (${item.quantity}) - مستودع ${item.warehouse}</span>
                        <span>${(item.price * item.quantity).toLocaleString()} SDG</span>
                    `;
                    pdfProductsList.appendChild(productElement);
                });
                
                const template = document.getElementById('pdfTemplate');
                
                try {
                    downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إنشاء PDF...';
                    downloadBtn.disabled = true;
                    
                    const canvas = await html2canvas(template, {
                        scale: 2,
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff'
                    });
                    
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    
                    doc.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
                    doc.save(`Zoona-mall_Order_${orderData.orderId || ''}.pdf`);
                    
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i> تحميل نسخة PDF من الطلب';
                    downloadBtn.disabled = false;
                } catch (error) {
                    console.error('❌ خطأ في إنشاء PDF:', error);
                    document.getElementById('errorMsg').textContent = 'حدث خطأ أثناء إنشاء PDF. يرجى المحاولة مرة أخرى.';
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i> تحميل نسخة PDF من الطلب';
                    downloadBtn.disabled = false;
                }
            });
        }
        
        function saveUserInfo() {
            const userInfo = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                phone2: document.getElementById('phone2').value
            };
            localStorage.setItem('userInfo', JSON.stringify(userInfo));
        }
        
        // ========== تهيئة الصفحة ==========
        document.addEventListener('DOMContentLoaded', function() {
            userId = getOrCreateUserId();
            displayUserId();
            
            trackAffiliateClick();
            
            if (userInfo.name) {
                document.getElementById('name').value = userInfo.name;
                document.getElementById('name').classList.add('auto-filled');
            }
            if (userInfo.phone) {
                document.getElementById('phone').value = userInfo.phone;
                document.getElementById('phone').classList.add('auto-filled');
            }
            if (userInfo.phone2) {
                document.getElementById('phone2').value = userInfo.phone2;
                document.getElementById('phone2').classList.add('auto-filled');
            }
            
            loadSavedLocationFromTopbar();
            
            const warehouses = getUniqueWarehouses();
            Object.keys(warehouses).forEach(name => {
                if (!warehouseSelections[name]) {
                    warehouseSelections[name] = { city: null, type: null, price: 0 };
                }
            });
            
            renderWarehouseSections();
            updateSummaryAndTotal();
            
            const form = document.getElementById('orderForm');
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            const downloadBtn = document.getElementById('downloadPDF');
            const submitBtn = document.getElementById('submitBtn');
            const orderIdElement = document.getElementById('orderId');
            const backToHomeBtn = document.getElementById('backToHomeBtn');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                successMsg.textContent = '';
                errorMsg.textContent = '';
                orderIdElement.textContent = '';
                
                const validationError = validateForm();
                if (validationError) {
                    errorMsg.textContent = validationError;
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
                
                const orderId = generateOrderId();
                
                let totalProductsPrice = 0;
                let totalShipping = 0;
                let grandTotal = 0;
                let selectedCities = [];
                let paymentType = 'cod';
                
                const warehouses = getUniqueWarehouses();
                Object.keys(warehouses).forEach(name => {
                    const items = warehouses[name];
                    const warehouseTotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                    const selection = warehouseSelections[name];
                    if (selection && selection.city) {
                        const shippingCost = selection.price || 0;
                        totalProductsPrice += warehouseTotal;
                        totalShipping += shippingCost;
                        grandTotal += warehouseTotal + shippingCost;
                        selectedCities.push({
                            warehouse: name,
                            city: selection.city,
                            type: selection.type,
                            shipping: shippingCost
                        });
                        if (selection.type !== 'cod') {
                            paymentType = 'mixed';
                        }
                    }
                });
                
                const formData = {
                    orderId: orderId,
                    userId: userId,
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    phone2: document.getElementById('phone2').value,
                    products: cartItems,
                    city: selectedCities.map(c => c.city).join('، '),
                    cityType: paymentType === 'mixed' ? 'mixed' : 'cod',
                    shippingCost: totalShipping,
                    total: grandTotal,
                    address: document.getElementById('address').value,
                    location: userLocation,
                    date: new Date().toISOString(),
                    timestamp: Date.now(),
                    status: 'new',
                    affiliateId: getAffiliateId(),
                    warehouseSelections: selectedCities
                };
                
                try {
                    await createNewOrder(formData);
                    
                    saveUserInfo();
                    clearAffiliateIdFromStorage();
                    
                    successMsg.textContent = "تم إرسال طلبك بنجاح! يمكنك الآن تحميل نسخة PDF من إيصال الطلب.";
                    orderIdElement.textContent = `رقم الطلب: ${orderId}`;
                    
                    downloadBtn.classList.add('show');
                    downloadBtn.setAttribute('data-order', JSON.stringify(formData));
                    backToHomeBtn.style.display = 'block';
                    
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.6';
                    submitBtn.style.cursor = 'not-allowed';
                    submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> تم الإرسال بنجاح';
                    
                    localStorage.removeItem('cartItems');
                    cartItems = [];
                    
                    console.log('✅ تم إرسال الطلب بنجاح:', orderId);
                } catch (err) {
                    console.error('❌ خطأ في إرسال الطلب:', err);
                    errorMsg.textContent = "حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى.";
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الطلب';
                }
            });
            
            setupPDFDownload();
            
            if (cartItems.length === 0) {
                errorMsg.textContent = "السلة فارغة. يرجى إضافة منتجات أولا.";
            }
            
            console.log('🛒 عدد المنتجات في السلة:', cartItems.length);
            console.log('👤 معرف المستخدم الفريد:', userId);
        });
    </script>
</body>
